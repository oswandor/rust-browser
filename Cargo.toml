[package]
name = "rust-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI (egui 0.36 lockstep, renderizado vía wgpu -> Direct3D 12 en Windows)
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = "0.36"

# Ventana y event loop
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = "30"
pollster = "0.4"

# Motor web (WebView2 en Windows)
wry = "0.57"

# Utilidades
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
